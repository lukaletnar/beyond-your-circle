<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Beyond Your Circle. Meet first. Create together.">
<title>Beyond Your Circle</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--ink:#0f0f0f;--blue:#3434e4;--orange:#ffb000;--paper:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;padding:clamp(18px,4vw,56px)}
.shell{max-width:1440px;width:100%;margin:auto;min-height:calc(100svh - clamp(18px,4vw,56px)*2);display:flex;flex-direction:column}
header,footer{display:grid;grid-template-columns:1fr auto auto;align-items:stretch;border-block:1px solid var(--ink);font-size:clamp(10px,1.25vw,15px);line-height:1.25;font-weight:700;text-transform:uppercase}
header>div,footer>div{padding:12px 16px;display:flex;justify-content:center;flex-direction:column}header .launch{background:var(--orange);color:var(--ink);border-inline:1px solid var(--ink);text-align:center}header .mark,footer .mark{padding:10px 14px;align-items:center} .mark svg{width:30px;height:30px;color:var(--orange)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(34px,7vw,96px) 0;text-align:center}.hero{max-width:100%;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2.5vw,32px)}.hero svg{width:clamp(68px,12vw,150px);height:auto;color:var(--blue)}
h1{font-family:'Arial Black',Arial,Helvetica,sans-serif;font-weight:1000;font-size:clamp(44px,10.4vw,160px);line-height:.92;letter-spacing:-.055em;margin:0;text-transform:uppercase;max-width:100%}h1 span{display:block}h2{font-size:clamp(18px,3vw,38px);letter-spacing:-.035em;color:var(--blue);margin:0;text-transform:uppercase;font-weight:900;text-wrap:balance}p{font-size:clamp(13px,1.6vw,18px);margin:0;line-height:1.5;text-wrap:balance} .date{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.bottom{grid-template-columns:auto 1fr auto}.bottom .mark{border-right:1px solid var(--ink)}.bottom .arrow{color:var(--blue);font-size:34px;line-height:1;border-left:1px solid var(--ink);min-width:80px;text-align:center}
@media(max-width:480px){body{padding:16px}.shell{min-height:calc(100svh - 32px)}header>div,footer>div{padding:9px 8px}header .mark,footer .mark{padding:8px}.mark svg{width:24px;height:24px}.bottom .arrow{min-width:46px;font-size:26px}h1{font-size:clamp(40px,12vw,58px)}.hero{gap:22px}header{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<header><div>Beyond Your Circle<br>November 2026</div><div class="launch">The launch</div><div class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="currentColor"><path d="M40 0h20v33l28-16 10 17-28 16 28 16-10 17-28-16v33H40V67L12 83 2 66l28-16L2 34l10-17 28 16z"/></svg></div></header>
<main><section class="hero" aria-labelledby="brand"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M40 0h20v33l28-16 10 17-28 16 28 16-10 17-28-16v33H40V67L12 83 2 66l28-16L2 34l10-17 28 16z"/></svg><h1 id="brand"><span>Beyond</span><span>Your Circle.</span></h1><h2>Meet first. Create together.</h2><p>The live experience begins November 20, 2026.</p><p class="date">Coming soon</p></section></main>
<footer class="bottom"><div class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="currentColor"><path d="M40 0h20v33l28-16 10 17-28 16 28 16-10 17-28-16v33H40V67L12 83 2 66l28-16L2 34l10-17 28 16z"/></svg></div><div>Beyond Your Circle<br>Designed to connect.</div><div class="arrow" aria-hidden="true">→</div></footer>
</div>
</body>
</html>
